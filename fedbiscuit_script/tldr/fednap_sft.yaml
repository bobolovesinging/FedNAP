use_gpu: true
device: 0
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 250
  save_to: outputs/tldr/sft/policy.ckpt
  save_freq: 50
  share_local_model: true
  online_aggr: false
data:
  root: data
  type: reddit-tldr-finetuning@llm
  splits:
  - 0.9
  - 0.09
  - 0.01
  splitter: iid
llm:
  tok_len: 1024
  max_new_token: 80
  accelerator:
    use: true
  chat:
    max_len: 1024
  adapter:
    use: true
    args:
    - adapter_package: peft
      adapter_method: lora
      r: 8
      lora_alpha: 16
      lora_dropout: 0.05
  grad_accum_step: 4
dataloader:
  batch_size: 8
model:
  type: models/gemma-2b@huggingface_llm
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    betas:
    - 0.9
    - 0.95
    lr: 0.0001
  is_enable_half: true
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmtrainer
eval:
  freq: 50
  metrics:
  - loss
  - acc
  best_res_update_round_wise_key: val_loss
  count_flops: false
outdir: outputs/tldr/sft
