seed: 0
use_gpu: true
device: 0
early_stop:
  patience: 0
federate:
  mode: standalone
  client_num: 1
  total_round_num: 150
  save_to: outputs/tldr/dpo/policy.ckpt
  save_freq: 50
  share_local_model: true
  online_aggr: false
data:
  root: data
  type: reddit-tldr-rlhf@llm
  splits:
  - 0.9
  - 0.09
  - 0.01
  splitter: iid
llm:
  rlhf: true
  tok_len: 1024
  max_new_token: 80
  num_completions: 2
  accelerator:
    use: true
  chat:
    max_len: 1024
  adapter:
    use: true
    args:
    - adapter_package: peft
      adapter_method: lora
      r: 8
      lora_alpha: 16
      lora_dropout: 0.05
  reward_coeff: 0.1
  grad_accum_step: 8
dataloader:
  batch_size: 4
model:
  type: models/gemma-2b@huggingface_llm
  load_from_local_pretrained_fs_config: fedbiscuit_script/tldr/fednap_sft.yaml
  load_from_local_pretrained_model_path: outputs/tldr/sft/final_policy.ckpt
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: RMSprop
    lr: 1.0e-06
  is_enable_half: true
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmrewardtrainer
eval:
  freq: 50
  metrics:
  - loss
  - acc
  best_res_update_round_wise_key: val_loss
  count_flops: false
outdir: outputs/tldr/dpo
